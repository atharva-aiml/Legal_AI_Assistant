<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');
:root {
  --color-neutral-0:#FFFFFF; --color-neutral-50:#F8F7F4; --color-neutral-100:#F0EEE8; --color-neutral-200:#E3E0D8;
  --color-neutral-300:#CBC6BA; --color-neutral-400:#A8A196; --color-neutral-500:#7D7669; --color-neutral-600:#5C564C;
  --color-neutral-700:#423E37; --color-neutral-800:#2B2822; --color-neutral-900:#1C1A16;
  --color-primary-50:#EAF0F6; --color-primary-100:#CBDDEC; --color-primary-200:#9EC0DE; --color-primary-300:#6D9FC9;
  --color-primary-400:#3F7FAF; --color-primary-500:#1F4E79; --color-primary-600:#17395A; --color-primary-700:#102941;
  --color-bg-page:#F8F7F4; --color-bg-surface:#FFFFFF; --color-bg-surface-hover:#F0EEE8; --color-bg-surface-sunken:#F0EEE8;
  --color-bg-selected:#EAF0F6;
  --color-text-primary:#1C1A16; --color-text-secondary:#5C564C; --color-text-tertiary:#7D7669; --color-text-disabled:#A8A196;
  --color-text-link:#1F4E79; --color-text-link-hover:#17395A;
  --color-border-default:#E3E0D8; --color-border-strong:#CBC6BA; --color-border-focus:#1F4E79;
  --font-family-ui:'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-family-heading:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --radius-sm:4px; --radius-md:6px; --radius-lg:8px; --radius-full:9999px;
  --shadow-sm: 0 1px 2px rgba(41,34,24,0.06);
  --shadow-md: 0 4px 12px rgba(41,34,24,0.10);
  --shadow-lg: 0 16px 40px rgba(41,34,24,0.18);
  --focus-ring: 0 0 0 3px #9EC0DE;
  
  --color-success-base:#1E7B4D; --color-success-bg:#E8F5EE; --color-success-border:#B7E0C7; --color-success-text:#145C39;
  --color-warning-base:#B5790A; --color-warning-bg:#FBF1DE; --color-warning-border:#EDCB86; --color-warning-text:#7A5107;
  --color-error-base:#B3261E; --color-error-bg:#FBEAE9; --color-error-border:#E9B3AF; --color-error-text:#7C1A14;
  --color-info-base:#0E7C86; --color-info-bg:#E5F3F4; --color-info-border:#A9D6DA; --color-info-text:#0A5960;
  --color-ai-50:#EFEBF7; --color-ai-200:#CFC3E8; --color-ai-500:#5B4B9E; --color-ai-700:#40356F;
  --color-citation-50:#E7F0EF; --color-citation-200:#B9D6D3; --color-citation-500:#3E6E6B; --color-citation-700:#2A4C4A;
  --color-text-on-brand:#FFFFFF;
  --font-family-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

}

* { box-sizing: border-box; }
body { margin:0; background:var(--color-bg-page); color:var(--color-text-primary); font-family:var(--font-family-ui); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; }
h1,h2,h3,h4 { font-family:var(--font-family-heading); font-weight:600; color:var(--color-text-primary); margin:0; line-height:1.25; }
a { color:var(--color-text-link); text-decoration:none; }
a:hover { color:var(--color-text-link-hover); text-decoration:underline; }
.mono { font-family:var(--font-family-mono); font-size:0.925em; }
.text-tertiary { color:var(--color-text-tertiary); }
.text-secondary { color:var(--color-text-secondary); }
.text-sm { font-size:14px; }
.text-xs { font-size:12px; }

/* Nav */
.app-nav { display:flex; align-items:center; gap:24px; height:64px; padding:0 32px; background:var(--color-bg-surface); border-bottom:1px solid var(--color-border-default); }
.app-nav-brand { font-family:var(--font-family-heading); font-weight:600; font-size:19px; color:var(--color-text-primary); }
.app-nav-links { display:flex; align-items:center; gap:16px; }
.app-nav-link { display:inline-flex; align-items:center; height:36px; font-size:14px; color:var(--color-text-tertiary); border-bottom:2px solid transparent; }
.app-nav-link-active { color:var(--color-text-primary); font-weight:600; border-bottom-color:var(--color-primary-600); }
.app-nav-search { flex:1; max-width:280px; position:relative; }
.app-nav-search-input { width:100%; height:38px; padding:0 12px 0 40px; border-radius:var(--radius-full); border:1px solid var(--color-border-default); background:var(--color-bg-surface); color:var(--color-text-primary); font-family:var(--font-family-ui); font-size:14px; }
.app-nav-search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--color-neutral-500); display:flex; }
.app-nav-actions { display:flex; align-items:center; gap:12px; margin-left:auto; }
.nav-icon-btn { width:36px; height:36px; border-radius:var(--radius-full); display:inline-flex; align-items:center; justify-content:center; color:var(--color-text-secondary); background:none; border:none; }
.nav-avatar { width:32px; height:32px; border-radius:50%; background:var(--color-primary-500); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; }

/* Buttons */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; padding:0 16px; border-radius:var(--radius-md); border:1px solid transparent; font-family:var(--font-family-ui); font-weight:500; font-size:14px; cursor:pointer; white-space:nowrap; }
.btn-primary { background:var(--color-primary-500); color:#fff; border-color:var(--color-primary-500); }
.btn-secondary { background:var(--color-bg-surface); color:var(--color-neutral-800); border-color:var(--color-border-default); }

/* Cards */
.card { background:var(--color-bg-surface); border:1px solid var(--color-border-default); border-radius:var(--radius-lg); padding:16px; box-shadow:var(--shadow-sm); }

/* Badges */
.badge { display:inline-flex; align-items:center; gap:4px; border-radius:var(--radius-full); padding:2px 8px; font-size:12px; font-weight:500; border:1px solid; line-height:1.4; white-space:nowrap; }
.badge-info { background:var(--color-info-bg); border-color:var(--color-info-border); color:var(--color-info-text); }
.badge-neutral { background:var(--color-neutral-100); border-color:var(--color-neutral-300); color:var(--color-neutral-700); }
.badge-dot { width:6px; height:6px; border-radius:50%; background:currentColor; }

/* Dashboard */
.page-wrap { max-width:1400px; margin:0 auto; padding:32px 32px 48px; }
.dashboard-header { display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:16px; margin-bottom:28px; }
.stat-grid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; margin-bottom:24px; }
.stat-card { background:var(--color-bg-surface); border:1px solid var(--color-border-default); border-radius:var(--radius-lg); padding:12px; box-shadow:var(--shadow-sm); }
.stat-icon-badge { width:28px; height:28px; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.dashboard-grid { display:grid; grid-template-columns:1fr 360px; gap:16px; }
.section-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
.active-matters-grid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
.active-matter-card { display:flex; flex-direction:column; gap:8px; }
.active-matter-title { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.active-matter-meta { font-size:12px; color:var(--color-text-tertiary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.recent-row { display:flex; align-items:center; gap:10px; padding:8px 12px; }
.matter-avatar { width:28px; height:28px; border-radius:50%; background:var(--color-primary-100); color:var(--color-primary-700); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; flex-shrink:0; }
.cal-strip { display:flex; gap:8px; }
.cal-day-cell { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 4px; border-radius:var(--radius-md); background:var(--color-bg-surface-sunken); border:1px solid transparent; }
.cal-day-today { border-color:var(--color-primary-500); background:var(--color-bg-selected); }
.cal-day-label { font-size:10px; color:var(--color-text-tertiary); text-transform:uppercase; letter-spacing:0.04em; }
.cal-day-number { font-family:var(--font-family-heading); font-weight:600; font-size:16px; }
.cal-dot { width:4px; height:4px; border-radius:50%; background:var(--color-warning-base); }

/* Matter Detail / Chat */
.chat-header-row { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; padding:24px 32px 16px; border-bottom:1px solid var(--color-border-default); }
.doc-tab { display:flex; align-items:center; gap:4px; padding:6px 10px; border-radius:var(--radius-md); background:var(--color-bg-surface); border:1px solid var(--color-border-default); color:var(--color-text-secondary); font-size:12px; }
.chat-toggle-btn { width:28px; height:28px; border-radius:var(--radius-full); border:1px solid var(--color-ai-200); background:var(--color-ai-50); color:var(--color-ai-500); display:inline-flex; align-items:center; justify-content:center; }
.chat-body { padding:20px 32px; display:flex; flex-direction:column; gap:16px; }
.chat-row { display:flex; align-items:flex-start; gap:12px; }
.chat-row-user { justify-content:flex-end; }
.chat-avatar { width:28px; height:28px; border-radius:50%; background:var(--color-ai-50); color:var(--color-ai-500); display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.chat-bubble { padding:12px; border-radius:var(--radius-lg); background:var(--color-bg-surface-sunken); border:1px solid var(--color-border-default); font-size:14px; max-width:560px; }
.chat-row-user .chat-bubble { background:var(--color-bg-selected); border-color:var(--color-primary-200); }
.text-citation { color:var(--color-citation-500); }
.text-citation:hover { color:var(--color-citation-700); }
.chat-input-bar { display:flex; align-items:center; gap:8px; border:1px solid var(--color-border-default); border-radius:var(--radius-full); padding:6px 6px 6px 16px; background:var(--color-bg-surface); margin:0 32px 24px; }
.chat-input-text { flex:1; font-size:14px; color:var(--color-text-tertiary); }
.chat-send-btn { width:34px; height:34px; border-radius:var(--radius-full); background:var(--color-primary-500); color:#fff; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.pin-icon { color:var(--color-warning-base); }

/* Login */
.login-wrap { min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px; }
.login-brand { margin-bottom:32px; text-align:center; }
.login-card { width:100%; max-width:380px; display:flex; flex-direction:column; gap:16px; }
.field { display:flex; flex-direction:column; gap:8px; }
.field-label { font-size:14px; font-weight:500; color:var(--color-text-secondary); }
.input { width:100%; height:40px; padding:0 12px; border-radius:var(--radius-sm); border:1px solid var(--color-border-default); background:var(--color-bg-surface-sunken); color:var(--color-text-primary); font-family:var(--font-family-ui); font-size:14px; }

</style>
</helmet>

<div class="login-wrap">

  </div>

    <div class="field">
      <label class="field-label">Email</label>
      <input class="input" type="email" value="vikram.desai@meridianlegal.in" />
    </div>
    <div class="field">
      <label class="field-label">Password</label>
      <input class="input" type="password" value="••••••••••" />

    <button type="submit" class="btn btn-primary" style="width:100%;">Log in</button>
    <div class="text-sm text-secondary" style="text-align:center;">No account yet? <a href="#">Create one</a></div>
  </form>
</div></div>
