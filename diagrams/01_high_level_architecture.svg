<text x="840" y="186" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#ffffffcc" text-anchor="middle">Next.js 15 App Router · React 19 · UI only</text>
<rect x="560" y="250" width="560" height="96" rx="14" ry="14" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="1.8" opacity="1"/>
<text x="578" y="280" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17.5" font-weight="700" fill="#161B26" text-anchor="start">Frontend  —  Next.js (SD-001)</text>
<text x="578" y="300" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12.7" font-weight="400" fill="#4A5568" text-anchor="start">Server Components call javaFetch() (forwards session cookie server-side);</text>
<text x="578" y="317" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12.7" font-weight="400" fill="#4A5568" text-anchor="start">client components fetch JAVA_API_URL_PUBLIC with credentials:&#x27;include&#x27;.</text>
<text x="578" y="334" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12.7" font-weight="400" fill="#4A5568" text-anchor="start">No DB driver. No /api routes. No business logic. Renders 16 screens.</text>
