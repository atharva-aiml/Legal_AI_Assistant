<text x="848" y="796.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">document_chunks · chat_messages · citations</text>
<text x="848" y="815.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">+ documents.status → ready / failed</text>
<text x="848" y="835.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">Raw SQL via SQLAlchemy text() with an explicit CAST(:v AS vector)</text>
<text x="848" y="854.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">— deliberately not the ORM layer, to control the pgvector type.</text>
<text x="848" y="874.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">Files: /uploads on disk (dev) → Cloudflare R2 (prod), same interface.</text>
