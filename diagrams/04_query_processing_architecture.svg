<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1270" viewBox="0 0 1680 1270">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#5B6B85"/>
</marker>
<linearGradient id="navyG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#2C4A73"/><stop offset="1" stop-color="#1E3A5F"/>
</linearGradient>
<linearGradient id="purpG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#6D4FBF"/><stop offset="1" stop-color="#5B3FA6"/>
</linearGradient>
<linearGradient id="tealG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#2C8A8B"/><stop offset="1" stop-color="#1F6F70"/>
</linearGradient>
</defs>
<rect width="1680" height="1270" fill="#EEF1F6"/>
<text x="40" y="46" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="700" fill="#5B3FA6" text-anchor="start" letter-spacing="2.5">PIPELINE  ·  SD-005  CHATSERVICE._ANSWER()</text>
<text x="40" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#161B26" text-anchor="start">Query processing — two regimes, chosen by corpus size</text>
<text x="40" y="110" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400" fill="#4A5568" text-anchor="start">One code path, one decision: does the whole Matter fit in a single model call, or does retrieval have to gate and rank?</text>
<rect x="551.5999999999999" y="138" width="576.8000000000001" height="48" rx="12" ry="12" fill="#1E3A5F" stroke="none" stroke-width="0" opacity="1"/>
<text x="840.0" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">POST /api/matters/:id/chat  →  Java (auth + BR-008)  →  Python</text>
<rect x="560" y="218" width="560" height="82" rx="12" ry="12" fill="#FFFFFF" stroke="#9B2C2C" stroke-width="1.9" opacity="1"/>
<text x="840.0" y="250" font-family="'Consolas', 'SFMono-Regular', Menlo, monospace" font-size="15.5" font-weight="700" fill="#161B26" text-anchor="middle">ready_document_count(matter) == 0 ?</text>
<text x="840.0" y="274" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11.8" font-weight="400" fill="#4A5568" text-anchor="middle">if yes  →  HTTP 422  NoReadyDocumentsError  ·  &quot;upload a document first&quot;, never a guess</text>
<line x1="840" y1="300" x2="840" y2="336" stroke="#5B6B85" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="540" y="340" width="600" height="82" rx="12" ry="12" fill="#FFFFFF" stroke="#1F6F70" stroke-width="1.9" opacity="1"/>
<text x="840.0" y="372" font-family="'Consolas', 'SFMono-Regular', Menlo, monospace" font-size="15.5" font-weight="700" fill="#161B26" text-anchor="middle">all_ready_chunks(matter) · document_metadata(matter)</text>
<text x="840.0" y="396" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11.8" font-weight="400" fill="#4A5568" text-anchor="middle">matter-scoped + status=&#x27;ready&#x27;, hard-filtered in SQL (BR-005)</text>
<line x1="840" y1="422" x2="840" y2="458" stroke="#5B6B85" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="560" y="462" width="560" height="82" rx="12" ry="12" fill="#FFFFFF" stroke="#161B26" stroke-width="1.9" opacity="1"/>
<text x="840.0" y="494" font-family="'Consolas', 'SFMono-Regular', Menlo, monospace" font-size="15.5" font-weight="700" fill="#161B26" text-anchor="middle">Σ len(chunk.content)  ≤  FULL_CONTEXT_CHAR_CAP  (400,000)</text>
<text x="840.0" y="518" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11.8" font-weight="400" fill="#4A5568" text-anchor="middle">~34% headroom under gpt-4o-mini&#x27;s 128K-token ceiling</text>
<polyline points="700,544 700,566 435,566 435,588" fill="none" stroke="#5B6B85" stroke-width="2" marker-end="url(#arrow)" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="980,544 980,566 1245,566 1245,588" fill="none" stroke="#5B6B85" stroke-width="2" marker-end="url(#arrow)" stroke-linejoin="round" stroke-linecap="round"/>
<text x="455" y="560" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#256B4A" text-anchor="start">SMALL CORPUS</text>
<text x="1118" y="560" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#9A6B12" text-anchor="start">LARGE CORPUS</text>
<rect x="90" y="592" width="690" height="476" rx="16" ry="16" fill="#F1F6F2" stroke="#256B4A" stroke-width="2" opacity="1"/>
<text x="110" y="626" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="700" fill="#256B4A" text-anchor="start">Full-context path   (the common case)</text>
<rect x="110" y="644" width="650" height="158" rx="14" ry="14" fill="#FFFFFF" stroke="#256B4A" stroke-width="1.8" opacity="1"/>
<text x="128" y="674" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17.5" font-weight="700" fill="#256B4A" text-anchor="start">Send every Ready chunk — no ranking</text>
<text x="128" y="700.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">• no relevance threshold, no top-K cutoff</text>
<text x="128" y="719.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">• a broad question (&quot;complete chronology&quot;,</text>
<text x="128" y="739.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">  &quot;every important date&quot;) cannot miss content</text>
<text x="128" y="758.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">  that simply wasn&#x27;t in a ranked top-8</text>
<text x="128" y="778.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">• full_context = True  → returned to the lawyer</text>
<rect x="110" y="818" width="650" height="110" rx="14" ry="14" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="1.8" opacity="1"/>
<text x="128" y="848" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17.5" font-weight="700" fill="#161B26" text-anchor="start">Real, disclosed tradeoff</text>
<text x="128" y="874.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">Whole-document calls measured 10–15.5 s — over</text>
<text x="128" y="893.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">the 8 s p95 target. Narrow questions stay 2–7 s.</text>
<text x="128" y="913.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">Accepted with the user&#x27;s sign-off, for completeness.</text>
<rect x="110" y="944" width="650" height="108" rx="14" ry="14" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="1.8" opacity="1"/>
<text x="128" y="974" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#161B26" text-anchor="start">The below-threshold no-LLM guarantee does NOT apply here</text>
<text x="128" y="1000.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">the model always gets the corpus and decides what&#x27;s</text>
<text x="128" y="1019.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">answerable — backed by post-generation citation</text>
<text x="128" y="1039.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">verification, not by a pre-LLM refusal gate.</text>
<rect x="900" y="592" width="690" height="476" rx="16" ry="16" fill="#FBF6EC" stroke="#9A6B12" stroke-width="2" opacity="1"/>
<text x="920" y="626" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="700" fill="#9A6B12" text-anchor="start">Hybrid retrieval + RRF  (large Matters only)</text>
<rect x="920" y="644" width="650" height="132" rx="14" ry="14" fill="#FFFFFF" stroke="#9A6B12" stroke-width="1.8" opacity="1"/>
<text x="938" y="674" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17.5" font-weight="700" fill="#9A6B12" text-anchor="start">Three parallel lookups, all matter-scoped</text>
<text x="938" y="700.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">exact_match_chunks(refs)  — regex pulls &quot;page 54&quot;,</text>
<text x="938" y="719.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">   &quot;table 3&quot; etc. → direct SQL on the real column</text>
<text x="938" y="739.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">vector_search  — pgvector cosine, 20 candidates</text>
<text x="938" y="758.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">keyword_search — Postgres FTS (OR-flipped), 20 cand.</text>
<rect x="920" y="792" width="650" height="96" rx="14" ry="14" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="1.8" opacity="1"/>
<text x="938" y="822" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17.5" font-weight="700" fill="#161B26" text-anchor="start">Fuse  —  Reciprocal Rank Fusion (k=60)</text>
<text x="938" y="848.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">score(chunk) = Σ 1/(k + rank) over the lists it appears in.</text>
<text x="938" y="867.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">No hand-tuned blend weight between two score scales.</text>
<rect x="920" y="904" width="650" height="148" rx="14" ry="14" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="1.8" opacity="1"/>
<text x="938" y="934" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17.5" font-weight="700" fill="#161B26" text-anchor="start">Threshold gate  (content only)</text>
<text x="938" y="960.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">max fused score &lt; 0.01  → no LLM call. Try metadata-</text>
<text x="938" y="979.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">  only if a structural question; else fixed NOT_FOUND.</text>
<text x="938" y="999.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">&lt; 0.02 → answer, flagged low_confidence in the UI.</text>
<text x="938" y="1018.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">exact-match hit → always included, bypasses the gate,</text>
<text x="938" y="1038.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">  never capped at CONTEXT_SIZE (8), never low-confidence.</text>
<polyline points="435,1068 435,1098 840,1098 840,1120" fill="none" stroke="#5B6B85" stroke-width="2" marker-end="url(#arrow)" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="1245,1068 1245,1098 840,1098" fill="none" stroke="#5B6B85" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="560.0" y="1124" width="560" height="48" rx="12" ry="12" fill="#5B3FA6" stroke="none" stroke-width="0" opacity="1"/>
<text x="840.0" y="1154" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">→  Generation &amp; citation verification  (next diagram)</text>
<text x="1650" y="1248" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12" font-weight="400" fill="#7A869A" text-anchor="end">Legal AI Assistant  ·  from app/application/chat_service.py  ·  numbers are current constants, not final-tuned</text>
</svg>
