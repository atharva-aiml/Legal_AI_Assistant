<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1000" viewBox="0 0 1680 1000">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#5B6B85"/>
</marker>
<linearGradient id="navyG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#2C4A73"/><stop offset="1" stop-color="#1E3A5F"/>
</linearGradient>
<linearGradient id="purpG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#6D4FBF"/><stop offset="1" stop-color="#5B3FA6"/>
</linearGradient>
<linearGradient id="tealG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#2C8A8B"/><stop offset="1" stop-color="#1F6F70"/>
</linearGradient>
</defs>
<rect width="1680" height="1000" fill="#EEF1F6"/>
<text x="40" y="46" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="700" fill="#5B3FA6" text-anchor="start" letter-spacing="2.5">USER JOURNEY  ·  J1 (CORE VALUE PROOF)</text>
<text x="40" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#161B26" text-anchor="start">From an empty Matter to a cited answer</text>
<text x="40" y="110" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400" fill="#4A5568" text-anchor="start">What actually happens between a lawyer dropping a PDF and reading an answer with page-level citations.</text>
<rect x="60" y="150" width="1560" height="62" rx="12" ry="12" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="1.6" opacity="1"/>
<rect x="60" y="150" width="8" height="62" rx="0" ry="0" fill="#1E3A5F" stroke="none" stroke-width="0" opacity="1"/>
<text x="86" y="178" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#161B26" text-anchor="start">1  Open a Matter</text>
<text x="380" y="174" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">SCR-09 Matter Detail. Chat tab is disabled — &quot;Upload a document first.&quot;</text>
<line x1="840.0" y1="213" x2="840.0" y2="225" stroke="#5B6B85" stroke-width="1.8" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="60" y="226" width="1560" height="78" rx="12" ry="12" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="1.6" opacity="1"/>
<rect x="60" y="226" width="8" height="78" rx="0" ry="0" fill="#1E3A5F" stroke="none" stroke-width="0" opacity="1"/>
<text x="86" y="254" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#161B26" text-anchor="start">2  Upload files</text>
<text x="380" y="250" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">POST /api/matters/:id/documents (multipart). Java stores the file, writes a</text>
<text x="380" y="269" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">Document row (status=processing), fires ingestion at Python without waiting.</text>
<line x1="840.0" y1="305" x2="840.0" y2="317" stroke="#5B6B85" stroke-width="1.8" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="60" y="318" width="1560" height="78" rx="12" ry="12" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="1.6" opacity="1"/>
<rect x="60" y="318" width="8" height="78" rx="0" ry="0" fill="#5B3FA6" stroke="none" stroke-width="0" opacity="1"/>
<text x="86" y="346" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#161B26" text-anchor="start">3  Ingestion runs</text>
<text x="380" y="342" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">Python: extract text/tables/images → OCR + vision caption diagrams →</text>
<text x="380" y="361" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">adaptive chunk → embed each chunk → INSERT document_chunks → status=ready.</text>
<line x1="840.0" y1="397" x2="840.0" y2="409" stroke="#5B6B85" stroke-width="1.8" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="60" y="410" width="1560" height="78" rx="12" ry="12" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="1.6" opacity="1"/>
<rect x="60" y="410" width="8" height="78" rx="0" ry="0" fill="#1E3A5F" stroke="none" stroke-width="0" opacity="1"/>
<text x="86" y="438" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#161B26" text-anchor="start">4  Poll to Ready</text>
<text x="380" y="434" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">Frontend polls /documents every 3s. &quot;Uploading → Processing → Ready.&quot;</text>
<text x="380" y="453" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">A bad/empty file resolves to status=failed with a visible error_message.</text>
<line x1="840.0" y1="489" x2="840.0" y2="501" stroke="#5B6B85" stroke-width="1.8" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="60" y="502" width="1560" height="78" rx="12" ry="12" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="1.6" opacity="1"/>
<rect x="60" y="502" width="8" height="78" rx="0" ry="0" fill="#5B3FA6" stroke="none" stroke-width="0" opacity="1"/>
<text x="86" y="530" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#161B26" text-anchor="start">5  Ask a question</text>
<text x="380" y="526" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">POST /api/matters/:id/chat { question }. Java checks session + Matter</text>
<text x="380" y="545" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">ownership (BR-008), then proxies to Python&#x27;s internal /chat/:matterId.</text>
<line x1="840.0" y1="581" x2="840.0" y2="593" stroke="#5B6B85" stroke-width="1.8" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="60" y="594" width="1560" height="78" rx="12" ry="12" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="1.6" opacity="1"/>
<rect x="60" y="594" width="8" height="78" rx="0" ry="0" fill="#1F6F70" stroke="none" stroke-width="0" opacity="1"/>
<text x="86" y="622" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#161B26" text-anchor="start">6  Retrieve</text>
<text x="380" y="618" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">Corpus ≤ 400K chars → send every chunk. Otherwise hybrid retrieval:</text>
<text x="380" y="637" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">exact-identifier + vector + keyword → Reciprocal Rank Fusion → threshold gate.</text>
<line x1="840.0" y1="673" x2="840.0" y2="685" stroke="#5B6B85" stroke-width="1.8" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="60" y="686" width="1560" height="78" rx="12" ry="12" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="1.6" opacity="1"/>
<rect x="60" y="686" width="8" height="78" rx="0" ry="0" fill="#9A6B12" stroke="none" stroke-width="0" opacity="1"/>
<text x="86" y="714" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#161B26" text-anchor="start">7  Generate</text>
<text x="380" y="710" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">Numbered context + document metadata + last 4 turns → gpt-4o-mini at</text>
<text x="380" y="729" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">temperature 0, with a citation-required system prompt.</text>
<line x1="840.0" y1="765" x2="840.0" y2="777" stroke="#5B6B85" stroke-width="1.8" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="60" y="778" width="1560" height="78" rx="12" ry="12" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="1.6" opacity="1"/>
<rect x="60" y="778" width="8" height="78" rx="0" ry="0" fill="#256B4A" stroke="none" stroke-width="0" opacity="1"/>
<text x="86" y="806" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#161B26" text-anchor="start">8  Verify citations</text>
<text x="380" y="802" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">Every factual sentence must carry a [n] marker resolving to a real</text>
<text x="380" y="821" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">retrieved item. Unsupported sentences are stripped; one corrective retry.</text>
<line x1="840.0" y1="857" x2="840.0" y2="869" stroke="#5B6B85" stroke-width="1.8" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="60" y="870" width="1560" height="78" rx="12" ry="12" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="1.6" opacity="1"/>
<rect x="60" y="870" width="8" height="78" rx="0" ry="0" fill="#1E3A5F" stroke="none" stroke-width="0" opacity="1"/>
<text x="86" y="898" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#161B26" text-anchor="start">9  Persist + render</text>
<text x="380" y="894" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">Save ChatMessage + one Citation row per distinct source. UI reveals the</text>
<text x="380" y="913" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">answer with a client-side typing effect; citations link to document + page/section.</text>
<text x="1650" y="978" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12" font-weight="400" fill="#7A869A" text-anchor="end">Legal AI Assistant  ·  journey J1 from 03-UX-Product-Design.md, verified end-to-end by tests/e2e/chat.spec.ts</text>
</svg>
