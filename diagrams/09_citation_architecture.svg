<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="980" viewBox="0 0 1680 980">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#5B6B85"/>
</marker>
<linearGradient id="navyG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#2C4A73"/><stop offset="1" stop-color="#1E3A5F"/>
</linearGradient>
<linearGradient id="purpG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#6D4FBF"/><stop offset="1" stop-color="#5B3FA6"/>
</linearGradient>
<linearGradient id="tealG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#2C8A8B"/><stop offset="1" stop-color="#1F6F70"/>
</linearGradient>
</defs>
<rect width="1680" height="980" fill="#EEF1F6"/>
<text x="40" y="46" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="700" fill="#5B3FA6" text-anchor="start" letter-spacing="2.5">RAG DEEP-DIVE  ·  CITATIONS &amp; PROVENANCE</text>
<text x="40" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#161B26" text-anchor="start">Every sentence traces to one real location</text>
<text x="40" y="110" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400" fill="#4A5568" text-anchor="start">A citation a lawyer can&#x27;t open and check in the time it takes to read the excerpt doesn&#x27;t count.</text>
<rect x="60" y="150" width="560" height="78" rx="12" ry="12" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2" opacity="1"/>
<text x="80" y="180" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1E3A5F" text-anchor="start">Answer sentence</text>
<text x="80" y="204" font-family="'Consolas', 'SFMono-Regular', Menlo, monospace" font-size="12.2" font-weight="400" fill="#4A5568" text-anchor="start">&quot;The 1989 settlement required US$470 million [7].&quot;</text>
<line x1="340" y1="228" x2="340" y2="246" stroke="#5B6B85" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="60" y="246" width="560" height="78" rx="12" ry="12" fill="#FFFFFF" stroke="#5B3FA6" stroke-width="2" opacity="1"/>
<text x="80" y="276" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#5B3FA6" text-anchor="start">Marker [7]</text>
<text x="80" y="300" font-family="'Consolas', 'SFMono-Regular', Menlo, monospace" font-size="12.2" font-weight="400" fill="#4A5568" text-anchor="start">position in THIS prompt&#x27;s numbered list — never a page/section number</text>
<line x1="340" y1="324" x2="340" y2="342" stroke="#5B6B85" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="60" y="342" width="560" height="78" rx="12" ry="12" fill="#FFFFFF" stroke="#1F6F70" stroke-width="2" opacity="1"/>
<text x="80" y="372" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1F6F70" text-anchor="start">Retrieved item #7</text>
<text x="80" y="396" font-family="'Consolas', 'SFMono-Regular', Menlo, monospace" font-size="12.2" font-weight="400" fill="#4A5568" text-anchor="start">the chunk (or metadata row) actually offered to the model this call</text>
<line x1="340" y1="420" x2="340" y2="438" stroke="#5B6B85" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="60" y="438" width="560" height="78" rx="12" ry="12" fill="#FFFFFF" stroke="#1F6F70" stroke-width="2" opacity="1"/>
<text x="80" y="468" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1F6F70" text-anchor="start">Source chunk</text>
<text x="80" y="492" font-family="'Consolas', 'SFMono-Regular', Menlo, monospace" font-size="12.2" font-weight="400" fill="#4A5568" text-anchor="start">document_chunks row: content, page_number, section, chunk_type, element_number</text>
<line x1="340" y1="516" x2="340" y2="534" stroke="#5B6B85" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="60" y="534" width="560" height="78" rx="12" ry="12" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2" opacity="1"/>
<text x="80" y="564" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1E3A5F" text-anchor="start">Document</text>
<text x="80" y="588" font-family="'Consolas', 'SFMono-Regular', Menlo, monospace" font-size="12.2" font-weight="400" fill="#4A5568" text-anchor="start">documents row: file_name, storage_key</text>
<rect x="720" y="200" width="900" height="300" rx="14" ry="14" fill="#F4F1FB" stroke="#5B3FA6" stroke-width="1.8" opacity="1"/>
<text x="738" y="230" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#5B3FA6" text-anchor="start">→  one Citation row per distinct source location</text>
<text x="738" y="256.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">chat_message_id   → the specific answer it backs</text>
<text x="738" y="275.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">document_id       → documents  (ON DELETE SET NULL — the row and its</text>
<text x="738" y="295.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">                     excerpt survive the source file being deleted)</text>
<text x="738" y="314.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">page_number       → where determinable (PDF/image; real page-break DOCX)</text>
<text x="738" y="334.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">section           → heading breadcrump  &quot;53. Access to Justice &gt; Mass</text>
<text x="738" y="353.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">                     claims and vulnerable populations&quot;  (DOCX / adaptive PDF)</text>
<text x="738" y="373.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">excerpt           → chunk.content[:300] — the actual source text, never</text>
<text x="738" y="392.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">                     LLM-authored. A metadata citation&#x27;s excerpt is a</text>
<text x="738" y="412.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">                     Python-computed fact string (&quot;file.pdf has 11 pages.&quot;).</text>
<text x="738" y="431.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start"></text>
<text x="738" y="451.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">Persisted permanently with the message · never recomputed · not cached.</text>
<rect x="720" y="540" width="900" height="200" rx="14" ry="14" fill="#F1F6F2" stroke="#256B4A" stroke-width="1.8" opacity="1"/>
<text x="738" y="570" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#256B4A" text-anchor="start">Rules for the set</text>
<text x="738" y="596.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">• multi-fact answer from different locations → MULTIPLE rows, one per</text>
<text x="738" y="615.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">   source — never one blanket citation over everything</text>
<text x="738" y="635.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">• NOT_FOUND / OUT_OF_SCOPE answer → zero citations (nothing to cite)</text>
<text x="738" y="654.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">• BR-006 is a write-path invariant: an uncited factual assistant message</text>
<text x="738" y="674.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">   cannot be constructed through this codebase</text>
<text x="738" y="693.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">• UI renders each as a link → GET /api/documents/:id/download,</text>
<text x="738" y="713.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">   showing &quot;file.pdf, p.54, 53. Access to Justice &gt; …&quot;  +  the excerpt</text>
<line x1="620" y1="250" x2="712" y2="250" stroke="#5B6B85" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<text x="1650" y="958" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12" font-weight="400" fill="#7A869A" text-anchor="end">Legal AI Assistant  ·  from 06-AI-Architecture.md §4 + citation_verification.py + chat_repository.py  ·  Part 3/3</text>
</svg>
