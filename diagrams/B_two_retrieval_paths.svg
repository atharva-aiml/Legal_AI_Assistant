<text x="430" y="550" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#256B4A" text-anchor="middle">≤ CAP  ·  FULL CONTEXT</text>
<text x="1250" y="550" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#9A6B12" text-anchor="middle">&gt; CAP  ·  HYBRID RETRIEVAL</text>
<rect x="80" y="564" width="660" height="470" rx="16" ry="16" fill="#F1F6F2" stroke="#256B4A" stroke-width="2" opacity="1"/>
<rect x="100" y="582" width="620" height="150" rx="14" ry="14" fill="#FFFFFF" stroke="#256B4A" stroke-width="1.8" opacity="1"/>
<text x="118" y="612" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17.5" font-weight="700" fill="#256B4A" text-anchor="start">Every ready chunk → the LLM</text>
<text x="118" y="638.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">no ranking · no threshold gate · no top-K</text>
<text x="118" y="657.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">nothing a broad question could miss</text>
<text x="118" y="677.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">the common case in practice</text>
<rect x="100" y="748" width="620" height="118" rx="14" ry="14" fill="#FBF3E4" stroke="#9A6B12" stroke-width="1.8" opacity="1"/>
<text x="118" y="778" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17.5" font-weight="700" fill="#9A6B12" text-anchor="start">full_context = True</text>
<text x="118" y="804.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">returned to the lawyer on the response.</text>
<text x="118" y="823.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">The below-threshold no-LLM guarantee does</text>
<text x="118" y="843.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">NOT apply here — verification is the backstop.</text>
