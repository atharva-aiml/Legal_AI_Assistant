<text x="40" y="110" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400" fill="#4A5568" text-anchor="start">Cap raised 150K → 400K chars; an exact-identifier leg added; the answer now carries a full_context signal.  Amber = changed.</text>
