<text x="118" y="938.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">whole-document calls 10–15.5 s (over the 8 s</text>
<text x="118" y="957.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">p95 target); narrow questions 2–7 s.</text>
<text x="118" y="977.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">Accepted with the user&#x27;s sign-off.</text>
<rect x="760" y="564" width="840" height="588" rx="16" ry="16" fill="#FBF6EC" stroke="#9A6B12" stroke-width="2" opacity="1"/>
<rect x="780" y="582" width="800" height="148" rx="14" ry="14" fill="#FBF3E4" stroke="#9A6B12" stroke-width="1.8" opacity="1"/>
<text x="798" y="612" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#9A6B12" text-anchor="start">Exact-identifier match   —   NEW (gap #1, 2026-08-25)</text>
<text x="798" y="638.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">extract_identifier_refs(question) → any (page | section | table | image, N)?</text>
<text x="798" y="657.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">→ exact_match_chunks(): direct SQL on the real column</text>
<text x="798" y="677.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">   (page_number / element_number+chunk_type / section ~ &#x27;(^|&gt; )N\.&#x27;)</text>
<text x="798" y="696.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">NO LIMIT · NO ranking · BYPASSES the relevance-threshold refusal</text>
<rect x="1500.2" y="568" width="71.80000000000001" height="22" rx="11" ry="11" fill="#9A6B12" stroke="none" stroke-width="0" opacity="1"/>
<text x="1536.1" y="583" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">UPDATED</text>
<rect x="780" y="744" width="800" height="120" rx="14" ry="14" fill="#FFFFFF" stroke="#9A6B12" stroke-width="1.8" opacity="1"/>
<text x="798" y="774" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#9A6B12" text-anchor="start">Vector + keyword, in parallel</text>
<text x="798" y="800.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">vector_search : top 20 by pgvector cosine  &lt;=&gt;</text>
<text x="798" y="819.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">keyword_search : top 20 by ts_rank over to_tsvector(section || &#x27; &#x27; || content),</text>
<text x="798" y="839.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">   OR-flipped tsquery so one absent word doesn&#x27;t zero the match</text>
<rect x="780" y="878" width="800" height="88" rx="14" ry="14" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="1.8" opacity="1"/>
<text x="798" y="908" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#161B26" text-anchor="start">Reciprocal Rank Fusion  (k = 60)</text>
<text x="798" y="934.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">fused[id] = Σ 1 / (60 + rank) over each list a chunk appears in — no hand-tuned weight.</text>
<rect x="780" y="980" width="800" height="152" rx="14" ry="14" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="1.8" opacity="1"/>
<text x="798" y="1010" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#161B26" text-anchor="start">Gate &amp; assemble</text>
<text x="798" y="1036.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">no exact hit  AND  max fused &lt; 0.01  →  NO LLM call:</text>
<text x="798" y="1055.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">   metadata exists → answer from real system facts only;  else fixed NOT_FOUND</text>
<text x="798" y="1075.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">otherwise → exact chunks (uncapped)  +  top fused to fill CONTEXT_SIZE = 8</text>
<text x="798" y="1094.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">low_confidence = (no exact hit) AND (max fused &lt; 0.02)</text>
<text x="798" y="1114.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">full_context = False   → UI note: &quot;this Matter is large…&quot;</text>
