<rect width="1680" height="940" fill="#EEF1F6"/>
<text x="40" y="46" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="700" fill="#5B3FA6" text-anchor="start" letter-spacing="2.5">RAG DEEP-DIVE  ·  SCALE</text>
<text x="40" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#161B26" text-anchor="start">The same question gets a different guarantee at different sizes — and the lawyer is told which</text>
<text x="40" y="110" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400" fill="#4A5568" text-anchor="start">&quot;Summarise everything&quot; is complete below the cap, best-effort above it. That difference used to be silent.</text>
<rect x="80" y="200" width="1520" height="44" rx="10" ry="10" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="1.6" opacity="1"/>
<rect x="80" y="200" width="942.4" height="44" rx="10" ry="10" fill="#E7F1EC" stroke="none" stroke-width="0" opacity="1"/>
<line x1="1022.4" y1="190" x2="1022.4" y2="254" stroke="#161B26" stroke-width="2" stroke-linecap="round"/>
<text x="551.2" y="227" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="700" fill="#256B4A" text-anchor="middle">FULL-CONTEXT PATH   ·   every Ready chunk sent   ·   full_context = True</text>
<text x="1311.2" y="227" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="700" fill="#9A6B12" text-anchor="middle">HYBRID RETRIEVAL + RRF + top-8</text>
<text x="1022.4" y="182" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#161B26" text-anchor="middle">FULL_CONTEXT_CHAR_CAP = 400,000 chars</text>
<text x="80" y="274" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">0</text>
<text x="1600" y="274" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="end">→ corpus size (Σ chunk chars for the Matter&#x27;s Ready Documents)</text>
<rect x="80" y="320" width="500" height="300" rx="14" ry="14" fill="#F1F6F2" stroke="#256B4A" stroke-width="1.8" opacity="1"/>
<text x="98" y="350" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#256B4A" text-anchor="start">Small / typical Matter</text>
<text x="98" y="376.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">• below the cap — the common case in practice</text>
<text x="98" y="395.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">• no ranking, no threshold gate, no top-K</text>
<text x="98" y="415.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">• a broad question genuinely considers all content</text>
<text x="98" y="434.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">• measured cost: whole-document calls 10–15.5 s;</text>
<text x="98" y="454.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">   narrow questions on the same Matter 2–7 s</text>
<text x="98" y="473.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start"></text>
<text x="98" y="493.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">The below-threshold no-LLM guarantee does NOT</text>
<text x="98" y="512.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">apply here — the model always sees the corpus and</text>
<text x="98" y="532.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">citation verification is the backstop.</text>
<rect x="600" y="320" width="480" height="300" rx="14" ry="14" fill="#FBF6EC" stroke="#9A6B12" stroke-width="1.8" opacity="1"/>
<text x="618" y="350" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#9A6B12" text-anchor="start">Large Matter (&gt; 400K chars)</text>
<text x="618" y="376.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">• hybrid retrieval + RRF + CONTEXT_SIZE = 8</text>
<text x="618" y="395.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">• exact-identifier chunks added uncapped, so</text>
<text x="618" y="415.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">   &quot;page 54&quot; / &quot;table 3&quot; still can&#x27;t be missed</text>
<text x="618" y="434.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">• below RELEVANCE_THRESHOLD (0.01) → no LLM</text>
<text x="618" y="454.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">   call; try metadata, else fixed NOT_FOUND</text>
<text x="618" y="473.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">• below CONFIDENT_THRESHOLD (0.02) → answer</text>
<text x="618" y="493.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">   flagged low_confidence</text>
<text x="618" y="512.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start"></text>
<text x="618" y="532.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">full_context = False → UI note: &quot;this Matter is</text>
<text x="618" y="551.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">large … ask about a specific page/section/table.&quot;</text>
<rect x="1100" y="320" width="500" height="300" rx="14" ry="14" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="1.8" opacity="1"/>
<text x="1118" y="350" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#161B26" text-anchor="start">How the cap was set</text>
<text x="1118" y="376.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">Spiked against the real API, not assumed:</text>
<text x="1118" y="395.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">• 712,694-char prompt → API error: &quot;max context</text>
<text x="1118" y="415.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">   128000 tokens … resulted in 142,948 tokens&quot;</text>
<text x="1118" y="434.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">   (⇒ real ~4.99 chars/token for this corpus)</text>
<text x="1118" y="454.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">• ~416K-char prompt → OK in 10.6 s</text>
<text x="1118" y="473.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">• ~464K-char prompt → OK in 37.1 s  (variance-</text>
<text x="1118" y="493.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">   dominated — not a clean function of size)</text>
<text x="1118" y="512.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">→ 400K = round number, ~34% headroom under the</text>
<text x="1118" y="532.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">   hard token ceiling, covers the real 353K-char</text>
<text x="1118" y="551.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4A5568" text-anchor="start">   Matter that motivated the raise from 150K.</text>
<text x="840" y="690" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#161B26" text-anchor="middle">Deliberately NOT built: a map-reduce / multi-call architecture for unbounded corpora.</text>
<text x="840" y="714" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4A5568" text-anchor="middle" font-style="italic">No real Matter needs it yet — the largest fits one call. Logged as a deferred option, not a gap left unnoticed.</text>
<text x="1650" y="918" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12" font-weight="400" fill="#7A869A" text-anchor="end">Legal AI Assistant  ·  from chat_service.py constants + RAG-Pipeline-Development-History.md Phases 2 &amp; 8  ·  Part 3/3</text>
</svg>
