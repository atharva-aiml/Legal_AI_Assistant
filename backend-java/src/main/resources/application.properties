spring.application.name=backend
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/legal_ai_assistant
spring.datasource.username=legal_ai
spring.datasource.password=legal_ai_dev_password

# Schema is owned by the /database Drizzle migrations, not Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.frontend-origin=http://localhost:3000
app.secure-cookies=false
app.python-api-url=http://localhost:8000
app.storage.local-dir=../uploads

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
