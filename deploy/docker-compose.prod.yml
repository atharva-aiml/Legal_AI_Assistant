# Production stack for a single Oracle Cloud Always Free VM (portfolio demo).
# Run from the deploy/ folder:  docker compose -f docker-compose.prod.yml ...
# (deploy.sh wraps the whole sequence). Values come from deploy/.env.
#
#   Internet ──443/80──> caddy ─┬─ /api/*, /health ─> backend:8080
#                               └─ everything else  ─> frontend:3000
#
# One origin for UI + API, so the SameSite=Lax session cookie just works and
# CORS never triggers. Only Caddy publishes ports; Postgres is internal-only.

name: legal-ai

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: legal_ai_assistant
      POSTGRES_USER: legal_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty data volume: pgvector must exist before the
      # first migration touching document_chunks (CLAUDE.md §4).
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_ai -d legal_ai_assistant"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 768m

  # One-shot: `docker compose run --rm migrate` (not started by `up`).
  migrate:
    build: ../database
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://legal_ai:${POSTGRES_PASSWORD}@postgres:5432/legal_ai_assistant
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ../backend-python
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://legal_ai:${POSTGRES_PASSWORD}@postgres:5432/legal_ai_assistant
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?set GOOGLE_API_KEY in deploy/.env}
      LLM_CHAT_MODELS: ${LLM_CHAT_MODELS:-gemini-3.5-flash-lite,gemini-3.1-flash-lite}
      FRONTEND_ORIGIN: https://${DOMAIN:?set DOMAIN in deploy/.env}
      SECURE_COOKIES: "true"
      STORAGE_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2g

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_JAVA_API_URL: https://${DOMAIN}
    restart: unless-stopped
    environment:
      # Server Components call the backend directly on the internal network.
      JAVA_API_URL: http://backend:8080
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      - backend
    mem_limit: 640m

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    mem_limit: 256m

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
